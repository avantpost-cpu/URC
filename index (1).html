<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Téléchargez les affiches de la campagne pour la paix de l’URC.">

  <title>Affiches pour la paix — URC</title>

  <style>
    :root{
      --red:#c51f26;
      --blue:#1f6675;
      --turquoise:#1cb6bd;
      --yellow:#f2b324;
      --ink:#1e1e1e;
      --paper:#f7f5f0;
      --white:#ffffff;
      --border:#d8d3c9;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      background:#e9e7e2;
      font-family:Arial, Helvetica, sans-serif;
      line-height:1.45;
    }

    .top-bar{
      height:12px;
      background:linear-gradient(
        90deg,
        var(--red) 0 42%,
        var(--blue) 42% 69%,
        var(--turquoise) 69% 86%,
        var(--yellow) 86% 100%
      );
    }

    .document{
      width:min(1180px, calc(100% - 32px));
      margin:30px auto 70px;
    }

    .page{
      position:relative;
      padding:46px;
      overflow:hidden;
      background:var(--paper);
      border-radius:30px;
      box-shadow:0 12px 34px rgba(0,0,0,.10);
    }

    .header-grid{
      display:grid;
      grid-template-columns:190px 1fr;
      gap:36px;
      align-items:start;
      margin-bottom:42px;
    }

    .logo{
      display:block;
      width:180px;
      max-width:100%;
      height:auto;
    }

    .kicker{
      margin-bottom:10px;
      color:var(--blue);
      font-size:15px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    h1{
      max-width:820px;
      margin:0;
      color:var(--red);
      font-size:clamp(42px, 6vw, 72px);
      line-height:.92;
      letter-spacing:-.04em;
      font-weight:900;
      text-transform:uppercase;
    }

    .intro{
      max-width:780px;
      margin:22px 0 0;
      font-size:22px;
      line-height:1.3;
      font-weight:700;
    }

    .posters{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:24px;
    }

    .poster-link{
      position:relative;
      display:block;
      overflow:hidden;
      color:var(--white);
      background:var(--blue);
      border:4px solid var(--white);
      border-radius:22px;
      box-shadow:0 8px 22px rgba(0,0,0,.14);
      text-decoration:none;
      transition:transform .2s ease, box-shadow .2s ease;
    }

    .poster-link:nth-child(2){
      background:var(--red);
    }

    .poster-link:nth-child(3){
      background:var(--turquoise);
    }

    .poster-link:hover,
    .poster-link:focus-visible{
      transform:translateY(-7px);
      box-shadow:0 16px 32px rgba(0,0,0,.20);
    }

    .poster-link:focus-visible{
      outline:5px solid var(--yellow);
      outline-offset:4px;
    }

    .poster-image{
      display:block;
      width:100%;
      height:auto;
      aspect-ratio:639 / 925;
      object-fit:cover;
      background:var(--white);
    }

    .download-label{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      min-height:68px;
      padding:15px 18px;
      font-size:16px;
      font-weight:900;
      text-transform:uppercase;
    }

    .download-icon{
      display:flex;
      flex:0 0 38px;
      align-items:center;
      justify-content:center;
      width:38px;
      height:38px;
      color:var(--ink);
      background:var(--yellow);
      border-radius:50%;
      font-size:22px;
      line-height:1;
    }

    .note{
      margin:32px 0 0;
      padding:18px 22px;
      color:var(--white);
      background:var(--blue);
      border-radius:18px;
      font-size:16px;
      font-weight:700;
      text-align:center;
    }

    @media(max-width:860px){
      .posters{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }
    }

    @media(max-width:650px){
      .document{
        width:min(100% - 20px, 1180px);
        margin-top:14px;
      }

      .page{
        padding:28px 20px;
        border-radius:20px;
      }

      .header-grid{
        grid-template-columns:1fr;
        gap:22px;
        margin-bottom:30px;
      }

      .logo{
        width:140px;
      }

      .intro{
        font-size:19px;
      }

      .posters{
        grid-template-columns:1fr;
      }

      .poster-link{
        width:min(100%, 440px);
        margin:0 auto;
      }
    }

    @media(prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        scroll-behavior:auto !important;
        transition:none !important;
      }
    }
  </style>
</head>

<body>
  <div class="top-bar" aria-hidden="true"></div>

  <main class="document">
    <section class="page">
      <header class="header-grid">
        <img class="logo" src="logo_URC.png" alt="URC — Union pour la reconstruction communiste">

        <div>
          <div class="kicker">Campagne pour la paix</div>
          <h1>Télécharge nos affiches</h1>
          <p class="intro">
            Clique sur l’affiche de ton choix pour télécharger sa version PDF prête à imprimer.
          </p>
        </div>
      </header>

      <div class="posters">
        <a class="poster-link" href="Affiche%20Paix_3.pdf" download="Affiche-URC-Paix-3.pdf" aria-label="Télécharger l’affiche Pas un soldat, pas une arme, pas un centime pour leurs guerres au format PDF">
          <img class="poster-image" src="A.png" alt="Affiche Pas un soldat, pas une arme, pas un centime pour leurs guerres">
          <span class="download-label">
            Télécharger en PDF
            <span class="download-icon" aria-hidden="true">↓</span>
          </span>
        </a>

        <a class="poster-link" href="Affiche%20Paix_2.pdf" download="Affiche-URC-Paix-2.pdf" aria-label="Télécharger l’affiche 413 milliards d’euros pour financer la guerre, combien pour financer nos quartiers au format PDF">
          <img class="poster-image" src="B.png" alt="Affiche 413 milliards d’euros pour financer la guerre, combien pour financer nos quartiers">
          <span class="download-label">
            Télécharger en PDF
            <span class="download-icon" aria-hidden="true">↓</span>
          </span>
        </a>

        <a class="poster-link" href="Affiche%20Paix_1.pdf" download="Affiche-URC-Paix-1.pdf" aria-label="Télécharger l’affiche 413 milliards d’euros pour financer la guerre, combien pour le 18e au format PDF">
          <img class="poster-image" src="C.png" alt="Affiche 413 milliards d’euros pour financer la guerre, combien pour le 18e">
          <span class="download-label">
            Télécharger en PDF
            <span class="download-icon" aria-hidden="true">↓</span>
          </span>
        </a>
      </div>

      <p class="note">Les trois fichiers sont au format A3, prêts à être imprimés.</p>
    </section>
  </main>
</body>

</html>
