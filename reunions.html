<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réunions — Bureau secteur Nord</title>
<style>
@font-face{font-family:'Archivo Black Local';src:url('./ArchivoBlack-Regular.ttf') format('truetype');font-display:swap}:root{--red:#c51f26;--blue:#1f6675;--yellow:#f2b324;--paper:#f7f5f0;--cream:#f2e4d8;--ink:#1e1e1e;--line:#d8d3c9;--green:#18845a}*{box-sizing:border-box}body{margin:0;background:#e9e7e2 url('https://avantpost-cpu.github.io/URC/fond.jpg') center/cover fixed no-repeat;color:var(--ink);font:15px/1.45 Arial,sans-serif}body::before{content:"";position:fixed;z-index:0;inset:0;pointer-events:none;background:url('https://avantpost-cpu.github.io/URC/taches.png') center top/125% auto no-repeat}.topbar{position:sticky;z-index:10;top:0;padding:12px 20px;background:#fffffff2;border-bottom:1px solid #d7d3cc}.topbar>div{display:flex;justify-content:space-between;align-items:center;width:min(940px,100%);margin:auto;font-size:13px;font-weight:900;text-transform:uppercase}.link{padding:6px 12px;border-radius:999px;color:#fff;background:var(--red);text-decoration:none;font-size:11px}.wrap{position:relative;z-index:1;width:min(940px,calc(100% - 24px));margin:22px auto 50px}.card{padding:30px;margin-bottom:18px;border-radius:22px;background:rgba(247,245,240,.92);box-shadow:0 10px 30px #0002}.hero{display:grid;grid-template-columns:130px 1fr;gap:25px;color:#fff;background:var(--red)}.hero img{width:110px}.kicker{font-weight:900;text-transform:uppercase}h1,h2,h3{font-family:'Archivo Black Local','Arial Black',sans-serif;font-weight:400;text-transform:uppercase}h1{margin:6px 0;font-size:42px;line-height:.95}h2{margin:0 0 15px;color:var(--red)}h3{margin:0 0 8px;color:var(--red);font-size:21px}.muted{color:#6d6962}.hidden{display:none!important}.login{max-width:480px;margin:10vh auto}.field{margin-bottom:15px}label,.legend{display:block;margin-bottom:6px;font-weight:800}input,select,textarea{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:10px;background:#fff;font:inherit}textarea{min-height:85px;resize:vertical}.btn{display:inline-block;padding:11px 17px;border:0;border-radius:999px;color:#fff;background:var(--blue);text-decoration:none;font-weight:900;cursor:pointer}.btn.red{background:var(--red)}.btn.light{color:#222;background:#e4e0d8}.meeting-list{display:grid;gap:15px}.meeting{padding:20px;border:2px solid var(--line);border-radius:16px;background:#fff}.meeting-head{display:flex;justify-content:space-between;gap:20px}.date{color:var(--blue);font-size:18px;font-weight:900}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dff3e8;color:#145b3a;font-size:11px;font-weight:900;text-transform:uppercase}.badge.completed{background:#e4e0d8;color:#555}.badge.cancelled{background:#fbe3e4;color:#8f151a}.counts{display:flex;gap:12px;margin:12px 0;color:var(--blue);font-weight:900}.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:14px 0}.box{padding:13px;border-radius:11px;background:#eef5f6}.box ul{margin:7px 0 0;padding-left:20px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice input{position:absolute;opacity:0}.choice label{height:100%;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff;text-align:center;cursor:pointer}.choice input:checked+label{color:#fff;background:var(--blue);border-color:var(--blue)}.response-form{margin-top:18px;padding:18px;border-radius:14px;background:var(--cream)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.message{display:none;margin:12px 0;padding:11px 14px;border-radius:10px;font-weight:800}.message.show{display:block}.error{color:#8f151a;background:#fbe3e4}.success{color:#145b3a;background:#dff3e8}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center}@media(max-width:700px){.hero{grid-template-columns:1fr}.hero img{width:90px}.hero h1{font-size:32px}.grid,.choices,.details-grid{grid-template-columns:1fr}.meeting-head{display:block}.card{padding:22px 17px}}
</style></head><body><header class="topbar"><div><span>Espace réunions</span><a class="link" href="./index.html">Accueil</a></div></header><main class="wrap">
<section id="codeView" class="card login"><h2>Bureau secteur Nord</h2><p>Entre le code commun du groupe pour consulter les réunions.</p><form id="codeForm"><div class="field"><label for="groupCode">Code du groupe</label><input id="groupCode" type="password" required autofocus></div><div id="codeMessage" class="message error"></div><button class="btn red" type="submit">Entrer dans l’espace</button></form></section>
<div id="spaceView" class="hidden"><section class="card hero"><img src="https://avantpost-cpu.github.io/URC/logo_URC2.png" alt="Logo URC"><div><div class="kicker">Espace de travail</div><h1 id="groupName">Bureau secteur Nord</h1><p>Prépare les réunions, indique ta présence et participe à l’ordre du jour.</p><button id="leaveSpace" class="btn light">Quitter l’espace</button></div></section><section class="card"><h2>Les réunions</h2><div id="spaceMessage" class="message"></div><div id="meetings" class="meeting-list"><div class="muted">Chargement…</div></div></section></div>
</main><script>
const SUPABASE_URL='https://kzqoxggchcdhmdydgooe.supabase.co',SUPABASE_ANON_KEY='sb_publishable_P2J2awOCTYEYwrWIup6stg_n0u7adqe',GROUP_SLUG='bureau-secteur-nord';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let groupCode=sessionStorage.getItem('meeting_group_code')||'',space=null;
async function rpc(name,body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok)throw new Error(data?.message||data||'Erreur');return data}
const dateText=m=>new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(m.meeting_date+'T12:00:00'));
function show(el,text,type='error'){el.textContent=text;el.className=`message ${type} show`}
function meetingStatus(s){return s==='completed'?'Terminée':s==='cancelled'?'Annulée':'À venir'}
function render(){const list=space.meetings||[];$('#groupName').textContent=space.group.name;$('#meetings').innerHTML=list.length?list.map(m=>`<article class="meeting"><div class="meeting-head"><div><div class="date">${esc(dateText(m))}${m.start_time?' — '+esc(m.start_time.slice(0,5)):''}</div><h3>${esc(m.title)}</h3><div>${esc(m.location||'Lieu à préciser')}</div></div><span class="badge ${m.status}">${meetingStatus(m.status)}</span></div>${m.description?`<p>${esc(m.description)}</p>`:''}<div class="counts"><span>${m.present_count||0} présent·e(s)</span><span>${m.maybe_count||0} peut-être</span></div><div class="details-grid"><div class="box"><strong>Ordre du jour</strong><div>${m.agenda?esc(m.agenda).replaceAll('\n','<br>'):'À compléter.'}</div></div><div class="box"><strong>Décisions</strong>${m.decisions?.length?`<ul>${m.decisions.map(d=>`<li>${esc(d.text)}</li>`).join('')}</ul>`:'<div>Aucune décision enregistrée.</div>'}</div></div>${m.tasks?.length?`<div class="box"><strong>Tâches</strong><ul>${m.tasks.map(t=>`<li>${esc(t.text)}${t.assignee?' — '+esc(t.assignee):''}${t.due_date?' (pour le '+new Date(t.due_date+'T12:00:00').toLocaleDateString('fr-FR')+')':''}${t.status==='done'?' ✓':''}</li>`).join('')}</ul></div>`:''}${m.status==='planned'?responseForm(m):''}</article>`).join(''):'<div class="muted">Aucune réunion n’est encore programmée.</div>';document.querySelectorAll('.response-form').forEach(f=>f.onsubmit=submitResponse)}
function responseForm(m){return `<form class="response-form" data-meeting="${m.id}"><h3>Ma réponse</h3><div class="grid"><div class="field"><label>Prénom et nom *</label><input name="full_name" required></div><div class="field"><div class="legend">Participation *</div><div class="choices"><div class="choice"><input id="p-${m.id}" type="radio" name="attendance" value="present" required><label for="p-${m.id}">Présent·e</label></div><div class="choice"><input id="m-${m.id}" type="radio" name="attendance" value="maybe"><label for="m-${m.id}">Peut-être</label></div><div class="choice"><input id="a-${m.id}" type="radio" name="attendance" value="absent"><label for="a-${m.id}">Absent·e</label></div></div></div><div class="field"><label>Mode de participation</label><select name="attendance_mode"><option value="">Non renseigné</option><option value="physical">Sur place</option><option value="remote">À distance</option></select></div><div class="field"><label>Point à proposer à l’ordre du jour</label><textarea name="agenda_proposal"></textarea></div></div><div class="field"><label>Remarque</label><textarea name="comment"></textarea></div><div class="response-message message"></div><button class="btn red" type="submit">Enregistrer ma réponse</button></form>`}
async function loadSpace(){try{space=await rpc('get_group_space',{p_slug:GROUP_SLUG,p_code:groupCode});sessionStorage.setItem('meeting_group_code',groupCode);$('#codeView').classList.add('hidden');$('#spaceView').classList.remove('hidden');render()}catch{$('#spaceView').classList.add('hidden');$('#codeView').classList.remove('hidden');sessionStorage.removeItem('meeting_group_code');groupCode='';show($('#codeMessage'),'Code incorrect.') }}
$('#codeForm').onsubmit=e=>{e.preventDefault();groupCode=$('#groupCode').value;loadSpace()};
async function submitResponse(e){e.preventDefault();const f=e.currentTarget,button=f.querySelector('button'),message=f.querySelector('.response-message'),attendance=f.querySelector('[name=attendance]:checked');button.disabled=true;try{await rpc('submit_meeting_response',{p_slug:GROUP_SLUG,p_code:groupCode,p_meeting_id:f.dataset.meeting,p_full_name:f.full_name.value.trim(),p_attendance:attendance.value,p_attendance_mode:f.attendance_mode.value||null,p_agenda_proposal:f.agenda_proposal.value,p_comment:f.comment.value});show(message,'Ta réponse est enregistrée. Tu peux la modifier en renvoyant le formulaire avec le même nom.','success');await loadSpace()}catch{show(message,'La réponse n’a pas pu être enregistrée.')}finally{button.disabled=false}}
$('#leaveSpace').onclick=()=>{sessionStorage.removeItem('meeting_group_code');location.reload()};if(groupCode)loadSpace();
</script></body></html>
